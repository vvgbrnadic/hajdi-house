[build]
  publish = "."
  command = "echo 'static site - FINAL ALL FIX - 2026-10-11'"

[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

