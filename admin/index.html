<style>
:root{--bg:#f2ece0;--gold:#b8952a;--dark:#2c2a24;--creamDark:#e8dfc8;--cream:#fcfaf5}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--dark)}
.card{background:white;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid var(--creamDark);margin:12px 0}
.input{width:100%;height:44px;border-radius:12px;border:1px solid var(--creamDark);background:var(--cream);padding:0 14px;margin:6px 0}
.textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--creamDark);background:var(--cream);padding:12px 14px;margin:6px 0;resize:vertical}
.tab{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--creamDark);background:white;font-size:12px;font-weight:600;cursor:pointer;margin:3px}
.tab.active{background:var(--dark);color:white}
.btn{height:44px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:13px}
.btn-dark{background:var(--dark);color:white} .btn-gold{background:var(--gold);color:white} .btn-red{background:#c2410c;color:white} .btn-light{background:white;border:1px solid var(--creamDark)}
#log{background:#2c2a24;color:#f2ece0;padding:12px;border-radius:12px;font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:320px;overflow:auto;padding:8px;background:var(--cream);border-radius:12px;border:1px solid var(--creamDark)}
.icon-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:10px;cursor:pointer;background:white;border:1px solid transparent;font-size:11px}
.icon-item:hover{border-color:var(--gold)} .icon-item.selected{background:var(--dark);color:white}
</style>
</head>

const LS_KEY='hajdi_full_config_v3', LS_GIT='hajdi_git_v3', LS_AUTH='hajdi_admin_auth';
function getCfg(){try{const s=localStorage.getItem(LS_KEY); if(s) return JSON.parse(s);}catch{} return JSON.parse(JSON.stringify(FALLBACK));}
function saveCfg(c){try{localStorage.setItem(LS_KEY,JSON.stringify(c));}catch(e){log('Nacrt nije spremljen ('+e.message+'). Velika slika ne stane u preglednik — upiši URL slike.');}}
function navText(item){return typeof item==='string'?item:(item&&item.label)||'';}
function navTarget(item){return item&&typeof item==='object'&&item.href?item.href:'';}
function setNav(i,key,val){const cur=config.header.nav[i]; const label=key==='label'?val:navText(cur); const href=key==='href'?val:navTarget(cur); config.header.nav[i]=href?{label:label,href:href}:label; saveCfg(config); reloadPreview();}
function addNav(){config.header.nav.push('Nova stavka'); saveCfg(config); render();}
function removeNav(i){config.header.nav.splice(i,1); saveCfg(config); render();}
function isBuiltin(sec){return ['hero','about','stats','features','amenities','pricing','gallery','location','contact','footer'].indexOf(sec)>=0;}
function secName(sec){const names={hero:'Hero',about:'O kući',stats:'Brojke',features:'Značajke',amenities:'Sadržaj',pricing:'Cjenik',gallery:'Galerija',location:'Lokacija',contact:'Kontakt',footer:'Footer'}; const custom=(config.customSections||[]).find(s=>s.id===sec); return custom?(custom.title||sec):(names[sec]||sec);}
function getGit(){try{const s=localStorage.getItem(LS_GIT); if(s) return JSON.parse(s);}catch{} return {owner:'vvgbrnadic',repo:'hajdi-house',branch:'main',token:'',pathConfig:'public/js/config.json',pathCsv:'public/js/cjenik.csv'};}
let config=getCfg(), gitCfg=getGit(), activeTab='dashboard', iconSearch='', iconResults=[], editingIdx=null;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
const AUTH_SALT='hajdi-house-admin-v1';
const AUTH_USER='2ad5ed2ba1814be93ce52fe98bdf81415ad14b6a71cd1136ff963f7a7392b679';
const AUTH_PASS='d4d0a2ca4d31230a72d5662d6c0510617c7e4fb98ac9a9374fc05c48728ecfd0';
const AUTH_SESSION='5cd214cd0c435d0f405c3105fb966f077f0543249605d31b5a9fb5a3e657de73';
function sameHex(a,b){a=String(a||''); b=String(b||''); if(a.length!==b.length) return false; let x=0; for(let i=0;i<a.length;i++) x|=a.charCodeAt(i)^b.charCodeAt(i); return x===0;}
async function sha256Hex(text){const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
function isAuthed(){try{return sameHex(localStorage.getItem(LS_AUTH), AUTH_SESSION)}catch(e){return false}}
function Login(){document.getElementById('app').innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2ece0;padding:24px"><form id="lf" style="background:white;padding:32px;border-radius:24px;width:100%;max-width:380px;border:1px solid #e8dfc8"><div style="font-family:serif;font-size:28px">Hajdi House</div><div style="font-size:13px;opacity:.6;margin-bottom:24px">Uredništvo stranice</div><label style="font-size:11px;opacity:.6" for="u">Korisničko ime</label><input id="u" class="input" autocomplete="username" aria-label="Korisničko ime"><label style="font-size:11px;opacity:.6" for="p">Lozinka</label><input id="p" type="password" class="input" autocomplete="current-password" aria-label="Lozinka"><div id="err" style="color:#b91c1c;font-size:12px;min-height:18px"></div><button class="btn btn-dark" style="width:100%;margin-top:12px">Uđi</button></form></div>`; document.getElementById('lf').addEventListener('submit',async e=>{e.preventDefault(); const err=document.getElementById('err'); const lock=Number(sessionStorage.getItem('hajdi_lock')||0); if(Date.now()<lock){err.textContent='Previše pokušaja. Pričekaj minutu.'; return;} const user=document.getElementById('u').value; const pass=document.getElementById('p').value; const u=await sha256Hex(AUTH_SALT+':user:'+user); const p=await sha256Hex(AUTH_SALT+':'+pass); if(sameHex(u,AUTH_USER)&&sameHex(p,AUTH_PASS)){sessionStorage.removeItem('hajdi_fail'); localStorage.setItem(LS_AUTH, AUTH_SESSION); render();} else {const n=Number(sessionStorage.getItem('hajdi_fail')||0)+1; sessionStorage.setItem('hajdi_fail', String(n)); if(n>=5){sessionStorage.setItem('hajdi_lock', String(Date.now()+60000)); sessionStorage.removeItem('hajdi_fail');} err.textContent='Krivi podaci';}});}
function setTab(id){activeTab=id; render();}
function logout(){localStorage.removeItem(LS_AUTH); render();}
function log(m){const line='['+new Date().toLocaleTimeString()+'] '+m; const el=document.getElementById('log'); if(el) el.innerText=line+'\n'+el.innerText.slice(0,3000); const git=document.getElementById('gitLog'); if(git) git.innerText=line+'\n'+git.innerText.replace(/^Spremno\n?/,'').slice(0,3000);}
async function searchIconify(q){if(!q||q.length<2){iconResults=[]; render(); return;} try{const r=await fetch('https://api.iconify.design/search?query='+encodeURIComponent(q)+'&limit=40'); if(r.ok){const j=await r.json(); iconResults=j.icons||[]; render();}}catch(e){}}
function update(path,val){const parts=path.split('.'); let o=config; for(let i=0;i<parts.length-1;i++) o=o[parts[i]]; o[parts[parts.length-1]]=val; saveCfg(config); reloadPreview(); log('Update '+path);}
function render(){if(!isAuthed()){Login(); return;} config=ensure(config); const c=config; const tabs=[['dashboard','Dashboard'],['header','Header'],['hero','Hero'],['about','O kući'],['stats','Stats'],['features','Značajke'],['amenities','Sadržaj + Ikone'],['gallery','Galerija'],['pricing','Cjenik'],['location','Lokacija'],['contact','Kontakt'],['footer','Footer'],['sections','Sekcije'],['colors','Boje'],['languages','Jezici'],['seo','SEO'],['git','Git Commit'],['raw','RAW']];
document.getElementById('app').innerHTML=`<div><div class="sticky top-0 z-50 bg-[#f2ece0]/90 backdrop-blur border-b border-[#e8dfc8] px-4 py-3 flex flex-wrap items-center justify-between gap-3"><div class="flex items-center gap-3"><div style="font-family:serif" class="text-xl font-bold">Hajdi CMS FULL</div><span class="text-[11px] opacity-50">${c.languages.join('/')} • ${c.pricing.map(p=>p.cijena).join('/')}</span></div><div class="flex flex-wrap gap-1 max-w-[85vw]">${tabs.map(([id,l])=>`<button class="tab ${activeTab===id?'active':''}" onclick="setTab('${id}')">${l}</button>`).join('')}<button class="tab" onclick="logout()">Odjava</button></div></div><div class="max-w-[1400px] mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-[1fr_420px] gap-6"><div id="mainPanel"></div><div class="lg:sticky lg:top-[72px] h-fit"><div class="card"><div class="flex justify-between mb-3"><span style="font-size:10px;letter-spacing:.8px;opacity:.6;font-weight:700">LIVE PREVIEW</span><button class="btn btn-light" style="height:32px;font-size:11px" onclick="reloadPreview()">Reload</button></div><iframe id="previewFrame" style="width:100%;height:600px;border:1px solid #e8dfc8;border-radius:16px;background:white"></iframe><div class="mt-3 flex gap-2"><button class="btn btn-dark" style="flex:1" onclick="downloadCfg()">⬇ config.json</button><button class="btn btn-gold" style="flex:1" onclick="downloadCSV()">CSV</button></div><div id="log" class="mt-3">Spremno. Sve autosave. Icon search: lucide + iconify API. Slike: upload base64 ili URL.</div></div></div></div></div>`;
const main=document.getElementById('mainPanel');
if(activeTab==='dashboard'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-2xl mb-2">Dashboard — sve editable</div><div class="text-[13px] opacity-70 leading-relaxed">Naslovi, tekstovi, slike, ikone, cijene, jezici, boje, redoslijed sekcija i nove sekcije uređuju se ovdje. Pregled desno je prava početna stranica.<br><br><b>Nacrt</b> je u ovom pregledniku. Posjetitelji vide <b>public/js/config.json</b> tek nakon Git commita ili kad zamijeniš preuzeti config.json.<br><b>Ikone:</b> klik na ikonu upiše je u odabranu stavku (gumb 🔍). Iconify: upiši upit i Enter.<br><b>Slike:</b> URL ili upload. Ako datoteka ne postoji, stranica pokaže rezervnu fotografiju.</div><div class="mt-4 flex flex-wrap gap-2"><button class="btn btn-dark" onclick="loadFromServer()">Učitaj config.json</button><button class="btn btn-light" onclick="window.open('/?cmspreview=1','_blank')">Otvori nacrt</button><button class="btn btn-light" onclick="window.open('/','_blank')">Otvori stranicu</button></div><div class="grid grid-cols-2 gap-3 mt-4"><div class="bg-[#fcfaf5] rounded-xl p-4 border"><div style="font-size:10px;opacity:.6">Stats</div>Amenities: ${c.amenities.length}<br>Gallery: ${c.gallery.length}<br>Jezici: ${c.languages.join(', ')}</div><div class="bg-[#fcfaf5] rounded-xl p-4 border"><div style="font-size:10px;opacity:.6">Git</div>${gitCfg.owner}/${gitCfg.repo}<br>Token: ${gitCfg.token?'*** OK':'nije postavljen'}</div></div></div>`;}
else if(activeTab==='header'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Header</div><label style="font-size:10px;opacity:.6">Logo text</label><input class="input" value="${esc(c.header.logoText)}" oninput="update('header.logoText',this.value)"><label style="font-size:10px;opacity:.6">Logo podnaslov</label><input class="input" value="${esc(c.header.logoSub)}" oninput="update('header.logoSub',this.value)"><label style="font-size:10px;opacity:.6">Logo slika</label><input class="input" value="${esc(c.header.logoImage||'')}" oninput="update('header.logoImage',this.value)" placeholder="URL slike"><input type="file" accept="image/*" onchange="uploadLogo(event)">${c.header.logoImage?`<button class="btn btn-light" type="button" onclick="clearLogo()">Makni logo</button><img alt="" src="${esc(c.header.logoImage)}" style="width:48px;height:48px;border-radius:999px;object-fit:cover;margin-top:8px">`:''}<label style="font-size:10px;opacity:.6">Naziv stranice</label><input class="input" value="${esc(c.site.name||'')}" oninput="update('site.name',this.value)"><label style="font-size:10px;opacity:.6">Gumb</label><input class="input" value="${esc(c.header.cta)}" oninput="update('header.cta',this.value)"><label style="font-size:10px;opacity:.6">Gumb vodi na</label><input class="input" value="${esc(c.header.ctaHref||'#kontakt')}" oninput="update('header.ctaHref',this.value)" placeholder="#kontakt"><div class="flex justify-between items-center mt-4"><span style="font-size:10px;opacity:.6">Izbornik</span><button class="btn btn-dark" style="height:36px" onclick="addNav()">+ Stavka</button></div>${c.header.nav.map((item,i)=>`<div class="flex gap-2"><input class="input" value="${esc(navText(item))}" oninput="setNav(${i},'label',this.value)" placeholder="Naziv"><input class="input" value="${esc(navTarget(item))}" oninput="setNav(${i},'href',this.value)" placeholder="#kontakt ili https://"><button class="btn btn-red" style="height:44px" onclick="rem else if(activeTab==='hero'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Hero</div><label style="font-size:10px;opacity:.6">Badge</label><input class="input" value="${esc(c.hero.badge)}" oninput="update('hero.badge',this.value)"><label style="font-size:10px;opacity:.6">Naslov</label><textarea class="textarea" oninput="update('hero.title',this.value)">${esc(c.hero.title)}</textarea><label style="font-size:10px;opacity:.6">Podnaslov</label><textarea class="textarea" oninput="update('hero.subtitle',this.value)">${esc(c.hero.subtitle)}</textarea><div class="grid grid-cols-2 gap-3"><div><label style="font-size:10px;opacity:.6">Gumb 1</label><input class="input" value="${esc(c.hero.cta1)}" oninput="update('hero.cta1',this.value)"><input class="input" value="${esc(c.hero.cta1Href||'#kontakt')}" oninput="update('hero.cta1Href',this.value)" placeholder="#kontakt"></div><div><label style="font-size:10px;opacity:.6">Gumb 2</label><input class="input" value="${esc(c.hero.cta2)}" oninput="update('hero.cta2',this.value)"><input class="input" value="${esc(c.hero.cta2Href||'#o-nama')}" oninput="update('hero.cta2Href',this.value)" placeholder="#o-nama"></div></div><label style="font-size:10px;opacity:.6">Slika URL</label><input class="input" value="${esc(c.hero.image)}" oninput="update('hero.image',this.value)"><input type="file" accept="image/*" onchange="uploadHero(event)" class="mt-2"><label style="font-size:10px;opacity:.6">Blur ${c.hero.blur}px</label><input type="range" min="0" max="20" value="${c.hero.blur}" oninput="update('hero.blur',parseInt(this.value))" style="width:100%"><img src="${esc(c.hero.image)}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:8px;filter:blur(${c.hero.blur}px)"></div>`;}
else if(activeTab==='about'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">O kući</div><label style="font-size:10px;opacity:.6">Oznaka</label><input class="input" value="${esc(c.about.kicker||'')}" oninput="update('about.kicker',this.value)"><label style="font-size:10px;opacity:.6">Naslov</label><input class="input" value="${esc(c.about.title)}" oninput="update('about.title',this.value)"><label style="font-size:10px;opacity:.6">P1</label><textarea class="textarea" style="min-height:100px" oninput="update('about.p1',this.value)">${esc(c.about.p1)}</textarea><label style="font-size:10px;opacity:.6">P2</label><textarea class="textarea" style="min-height:100px" oninput="update('about.p2',this.value)">${esc(c.about.p2)}</textarea><label style="font-size:10px;opacity:.6">Quote</label><input class="input" value="${esc(c.about.quote)}" oninput="update('about.quote',this.value)"><label style="font-size:10px;opacity:.6">Slika</label><input class="input" value="${esc(c.about.image)}" oninput="update('about.image',this.value)"><input type="file" accept="image/*" onchange="uploadAbout(event)"></div>`;}
else if(activeTab==='stats'){main.innerHTML=`<div class="card"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Stats</div><button class="btn btn-dark" onclick="addStat()">+ Dodaj</button></div><div class="mt-4 grid gap-2">${c.stats.map((s,i)=>`<div class="flex gap-2 items-center bg-[#fcfaf5] p-3 rounded-xl border"><input class="input" style="width:90px" value="${esc(s.value)}" oninput="updateStat(${i},'value',this.value)"><input class="input" style="flex:1" value="${esc(s.label)}" oninput="updateStat(${i},'label',this.value)"><button class="btn btn-red" style="height:36px" onclick="removeStat(${i})">X</button></div>`).join('')}</div></div>`;}
else if(activeTab==='features'){main.innerHTML=`<div class="card"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Značajke</div><button class="btn btn-dark" onclick="addFeature()">+ Dodaj</button></div><div class="mt-4 grid gap-3">${(c.features||[]).map((f,i)=>`<div class="bg-[#fcfaf5] p-3 rounded-xl border grid gap-2"><input class="input" value="${esc(f.title)}" oninput="updateFeature(${i},'title',this.value)" placeholder="Naslov"><input class="input" value="${esc(f.icon)}" oninput="updateFeature(${i},'icon',this.value)" placeholder="Ikona, npr. flame"><textarea class="textarea" oninput="updateFeature(${i},'desc',this.value)">${esc(f.desc)}</textarea><button class="btn btn-red" onclick="removeFeature(${i})">Ukloni</button></div>`).join('')}</div></div>`;}
else if(activeTab==='amenities'){const filtered=ALL_ICONS.filter(ic=>!iconSearch||ic.toLowerCase().includes(iconSearch.toLowerCase())).slice(0,120); main.innerHTML=`<div class="card"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Sadržaj + Ikone — pretraži bilo koju ikonu</div><button class="btn btn-dark" onclick="addAmenity()">+ Dodaj</button></div><label style="font-size:10px;opacity:.6">Naslov sekcije</label><input class="input" value="${esc(c.labels.amenitiesTitle)}" oninput="update('labels.amenitiesTitle',this.value)"><div class="mt-3 flex gap-2"><input class="input" placeholder="Pretraži lucide: fire, dog, mountain..." value="${esc(iconSearch)}" oninput="iconSearch=this.value; render()" style="flex:1"><input id="iconQ" class="input" placeholder="Iconify: npr. mdi:campfire" style="flex:1" onkeydown="if(event.key==='Enter')searchIconify(this.value)"><button class="btn btn-light" onclick="searchIconify(document.getElementById('iconQ').value)">Iconify API</button></div>${editingIdx!==null&&c.amenities[editingIdx]?`<div class="mt-2 text-[13px]">Klik na ikonu upisuje je u: <b>${esc(c.amenities[editingIdx].label)}</b></div>`:''}${iconResults.length?`<div class="mt-2"><div style="font-size:11px">Iconify rezultati ${iconResults.length}</div><div class="icon-grid mt-2">${iconResults.map(ic=>`<div class="icon-item" onclick="pickIconify('${ic}')">${ic}</div>`).join('')}</div></div>`:''}<div class="mt-3"><div style="font-size:10px;opacity:.6">Lucide (lokalno)</div><div class="icon-grid mt-2">${filtered.map(ic=>`<div class="icon-item" onclick="applyIcon('${ic}')"><i data-lucide="${ic}" class="w-5 h-5"></i><span>${ic}</span></div>`).join('')}</div></div><div class="mt-6 grid gap-3">${c.amenities.map((a,i)=>`<div class="bg-[#fcfaf5] p-3 rounded-xl border flex gap-2"><div style="flex:1" class="grid grid-cols-2 gap-2"><input class="input" value="${esc(a.label)}" oninput="updateAmen(${i},'label',this.value)" placeholder="Label"><select class="input" onchange="updateAmen(${i},'category',this.value)">${['Toplina','Priroda','Kuhinja','Spavanje','Ostalo','Tehnologija','Aktivnosti'].map(cat=>`<option ${a.category===cat?'selected':''}>${cat}</option>`).join('')}</select><div class="flex gap-1"><input class="input" value="${esc(a.icon)}" oninput="updateAmen(${i},'icon',this.value)" placeholder="ikona"><button class="btn btn-light" style="height:44px" onclick="editingIdx=${i}; render()">🔍</button></div><div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full bg-white border flex items-center justify-center">${iconSlot(a.icon)}</div><button class="btn btn-red" style="height:36px" onclick="removeAmen(${i})">Ukloni</button></div></div></div>`).join('')}</div></div>`; setTimeout(()=>{try{lucide.createIcons();}catch{}},100);}
else if(activeTab==='gallery'){main.innerHTML=`<div class="card"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Galerija</div><button class="btn btn-dark" onclick="addGal()">+ Dodaj</button></div><label style="font-size:10px;opacity:.6">Naslov sekcije</label><input class="input" value="${esc(c.labels.galleryTitle)}" oninput="update('labels.galleryTitle',this.value)"><input type="file" multiple accept="image/*" onchange="uploadGal(event)" class="mt-3"><div class="mt-4 grid grid-cols-2 md:grid-cols-3 gap-3">${c.gallery.map((g,i)=>`<div class="rounded-xl overflow-hidden border bg-white"><img src="${esc(g.image||g)}" style="width:100%;height:140px;object-fit:cover"><div class="p-2 flex gap-1"><input class="input" style="flex:1;height:36px;font-size:11px" value="${esc(g.image||g)}" oninput="updateGal(${i},this.value)"><button class="btn btn-red" style="height:36px" onclick="removeGal(${i})">X</button></div></div>`).join('')}</div></div>`;}
else if(activeTab==='pricing'){main.innerHTML=`<div class="card"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Cjenik</div><button class="btn btn-dark" onclick="addPrice()">+ Dodaj</button></div><label style="font-size:10px;opacity:.6">Naslov</label><input class="input" value="${esc(c.labels.pricingTitle)}" oninput="update('labels.pricingTitle',this.value)"><label style="font-size:10px;opacity:.6">Podnaslov</label><input class="input" value="${esc(c.labels.pricingNote)}" oninput="update('labels.pricingNote',this.value)"><div class="mt-4 grid gap-3">${c.pricing.map((p,i)=>`<div class="bg-[#fcfaf5] p-3 rounded-xl border grid grid-cols-2 gap-2"><input class="input" value="${esc(p.naziv)}" oninput="updatePrice(${i},'naziv',this.value)"><input class="input" value="${esc(p.cijena)}" oninput="updatePrice(${i},'cijena',this.value)"><input class="input" value="${esc(p.jedinica)}" oninput="updatePrice(${i},'jedinica',this.value)"><select class="input" onchange="updatePrice(${i},'aktivno',this.value==='true')"><option value="true" ${p.aktivno?'selected':''}>Aktivno</option><option value="false" ${!p.aktivno?'selected':''}>Neaktivno</option></select><textarea class="textarea col-span-2" oninput="updatePrice(${i},'opis',this.value)">${esc(p.opis)}</textarea><button class="btn btn-red col-span-2" onclick="removePrice(${i})">Ukloni</button></div>`).join('')}</div></div>`;}
else if(activeTab==='location'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Lokacija</div><input class="input" value="${esc(c.location.title||'')}" oninput="update('location.title',this.value)" placeholder="Naslov"><input class="input" value="${esc(c.location.address)}" oninput="update('location.address',this.value)" placeholder="Adresa"><input class="input" value="${esc(c.location.mapCta||'')}" oninput="update('location.mapCta',this.value)" placeholder="Tekst gumba"><div class="grid grid-cols-2 gap-2"><input class="input" value="${esc(c.location.lat)}" oninput="update('location.lat',this.value)" placeholder="Lat"><input class="input" value="${esc(c.location.lng)}" oninput="update('location.lng',this.value)" placeholder="Lng"></div><textarea class="textarea" oninput="update('location.desc',this.value)">${esc(c.location.desc)}</textarea><input class="input" value="${esc(c.location.googleMapsLink)}" oninput="update('location.googleMapsLink',this.value)" placeholder="Maps link"></div>`;}
else if(activeTab==='contact'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Kontakt</div><input class="input" value="${esc(c.contact.title)}" oninput="update('contact.title',this.value)" placeholder="Naslov"><input class="input" value="${esc(c.contact.subtitle)}" oninput="update('contact.subtitle',this.value)" placeholder="Podnaslov"><input class="input" value="${esc(c.contact.email)}" oninput="update('contact.email',this.value)" placeholder="Email"><input class="input" value="${esc(c.contact.phone)}" oninput="update('contact.phone',this.value)" placeholder="Telefon"><input class="input" value="${esc(c.contact.airbnb)}" oninput="update('contact.airbnb',this.value)" placeholder="Airbnb URL"><input class="input" value="${esc(c.contact.instagram)}" oninput="update('contact.instagram',this.value)" placeholder="Instagram URL"><div class="grid grid-cols-2 gap-2"><input class="input" value="${esc(c.contact.namePh||'')}" oninput="update('contact.namePh',this.value)" placeholder="Polje ime"><input class="input" value="${esc(c.contact.emailPh||'')}" oninput="update('contact.emailPh',this.value)" placeholder="Polje email"><input class="input" value="${esc(c.contact.msgPh||'')}" oninput="update('contact.msgPh',this.value)" placeholder="Polje poruka"><input class="input" value="${esc(c.contact.send||'')}" oninput="update('contact.send',this.value)" placeholder="Tekst gumba"></div><p class="text-[12px] opacity-60">Bez emaila obrazac samo pokaže uputu. Airbnb i Instagram se pojave uz kontakt kad upišeš URL.</p></div>`;}
else if(activeTab==='footer'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Footer</div><input class="input" value="${esc(c.footer.text)}" oninput="update('footer.text',this.value)" placeholder="Tekst u podnožju"><div class="flex justify-between items-center mt-3"><span style="font-size:10px;opacity:.6">Linkovi</span><button class="btn btn-dark" style="height:36px" onclick="addLink()">+ Link</button></div>${c.footer.links.map((l,i)=>`<div class="flex gap-2"><input class="input" value="${esc(l.label||'')}" oninput="setLink(${i},'label',this.value)" placeholder="Naziv"><input class="input" value="${esc(l.url||'')}" oninput="setLink(${i},'url',this.value)" placeholder="https:// ili #"><button class="btn btn-red" style="height:44px" onclick="removeLink(${i})">X</button></div>`).join('')}</div>`;}
else if(activeTab==='sections'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Poglavlja — redoslijed i vidljivost</div><div class="grid gap-2">${c.sections.order.map((sec,i)=>`<div class="flex items-center gap-2 bg-[#fcfaf5] p-3 rounded-xl border"><span class="flex-1">${i+1}. ${esc(secName(sec))}</span><button class="btn btn-light" style="height:32px" onclick="moveSec(${i},-1)">Gore</button><button class="btn btn-light" style="height:32px" onclick="moveSec(${i},1)">Dolje</button><label class="flex items-center gap-1 text-[12px]"><input type="checkbox" ${c.sections.visible[sec]!==false?'checked':''} onchange="toggleSec('${sec}',this.checked)"> Vidljivo</label>${isBuiltin(sec)?'':`<button class="btn btn-red" style="height:32px" onclick="removeSec('${sec}')">Ukloni</button>`}</div>`).join('')}</div><p class="text-[12px] opacity-60 mt-3">Ugrađena poglavlja se skrivaju kvačicom i ostaju ovdje da ih možeš vratiti. Vlastita poglavlja možeš ukloniti.</p><div class="mt-6"><div class="flex justify-between"><div style="font-family:serif" class="text-xl">Vlastita poglavlja</div><button class="btn btn-dark" onclick="addCustom()">+ Dodaj poglavlje</button></div><div class="mt-3 grid gap-3">${(c.customSections||[]).map((s,i)=>`<div class="bg-[#fcfaf5] p-3 rounded-xl border grid gap-2"><input class="input" value="${esc(s.title)}" oninput="updateCustom(${i},'title',this.value)" placeholder="Naslov"><textarea class="textarea" oninput="updateCustom(${i},'body',this.value)">${esc(s.body)}</textarea><input class="input" value="${esc(s.image||'')}" oninput="updateCustom(${i},'image',this.value)" placeholder="URL slike"><input type="file" accept="image/*" onchange="uploadCustom(${i},event)"><div class="text-[11px] opacity-50">Link: #${esc(s.id)}</div><div class="flex gap-2"><button class="btn btn-light" style="height:36px" onclick="moveCustom(${i},-1)">Gore</button><button class="btn btn-light" style="height:36px" onclick="moveCustom(${i},1)">Dolje</button><button class="btn btn-red" style="height:36px" onclick="removeCustom(${i})">Ukloni</button></div></div>`).join('')}</div></div></div>`;}
else if(activeTab==='colors'){main.innerHTML=`<div class="card"><div style="font-family:serif" class="text-xl mb-4">Boje</div><div class="grid grid-cols-2 gap-3"><div><label style="font-size:10px">Background</label><input type="color" value="${c.colors.background}" oninput="update('colors.background',this.value)" class="input" style="height:50px"><input class="input" value="${c.colors.background}" oninput="update('colors.background',this.value)"></div><div><label style="font-size:10px">Gold</label><input type="color" value="${c.colors.gold}" oninput="update('colors.gold',this.value)" class="input" style="height:50px"><input class="input" value="${c.colors.gold}" oninput="update('colors.gold',this.value)"></div><div><label style="font-size:10px">Dark</label><input type="color" value="${c.colors.dark}" oninput="update('colors.dark',this.value)" class="input" style="height:50px"><input class="input" value="${c.colors.dark}" oninput="update('colors.dark',this.value)"></div><div><label style="font-size:10px">CreamDark</label><input type="color" value="${c.colors.creamDark}" oninput="update('colors.creamDark',this.value)" class="input" style="height:50px"><input class="input" value="${c.colors.creamDark}" oninput="update('colors.creamDark',this.value)"></div></div></div>`;}

function sourceStrings(c){const out=[]; const add=v=>{if(typeof v==='string'&&v.trim()&&out.indexOf(v)<0) out.push(v);}; add(c.header&&c.header.logoText); add(c.header&&c.header.logoSub); add(c.header&&c.header.cta); (c.header&&c.header.nav||[]).forEach(item=>add(navText(item))); ['badge','title','subtitle','cta1','cta2'].forEach(k=>add(c.hero&&c.hero[k])); ['kicker','title','p1','p2','quote'].forEach(k=>add(c.about&&c.about[k])); (c.stats||[]).forEach(s=>add(s.label)); (c.features||[]).forEach(f=>{add(f.title); add(f.desc);}); (c.amenities||[]).forEach(a=>{add(a.label); add(a.category);}); Object.keys(c.labels||{}).forEach(k=>add(c.labels[k])); (c.pricing||[]).forEach(p=>{add(p.naziv); add(p.jedinica); add(p.opis);}); ['title','desc','address','mapCta'].forEach(k=>add(c.location&&c.location[k])); ['title','subtitle','namePh','emailPh','msgPh','send'].forEach(k=>add(c.contact&&c.contact[k])); (c.customSections||[]).forEach(s=>{add(s.title); add(s.body);}); add(c.footer&&c.footer.text); (c.footer&&c.footer.links||[]).forEach(l=>add(l.label)); add(c.seo&&c.seo.title); add(c.seo&&c.seo.description); ['Što te čeka','Cjenik','Minimalno 2 noći — sve transparentno','Galerija','Otvori Maps','Ime','Email','Poruka','Pošalji upit','Upiši email u adminu (Kontakt), pa će se upit otvoriti u mailu.'].forEach(add); return out;}

async function translateOne(text, lang){
  const tl=String(lang||'').toLowerCase();
  try{
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=hr&tl='+encodeURIComponent(tl)+'&dt=t&q='+encodeURIComponent(text));
    if(r.ok){const j=await r.json(); const out=(j[0]||[]).map(part=>part&&part[0]||'').join('').trim(); if(out) return out;}
  }catch(e){}
  const r2=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(String(text).slice(0,450))+'&langpair=hr|'+encodeURIComponent(tl));
  if(!r2.ok) throw new Error('Prijevod nije uspio');
  const j2=await r2.json();
  const out=j2.responseData&&j2.responseData.translatedText;
  if(!out||String(out).indexOf('MYMEMORY WARNING')===0) throw new Error('Prijevod nije uspio');
  return String(out).trim();
}
async function translateMissing(){
  const strings=sourceStrings(config);
  const langs=(config.languages||[]).filter(code=>code!=='HR');
  config.translations=config.translations||{};
  const jobs=[];
  langs.forEach(lang=>{config.translations[lang]=config.translations[lang]||{}; strings.forEach(src=>{if(!config.translations[lang][src]) jobs.push([lang,src]);});});
  if(!jobs.length){log('Svi prijevodi već postoje.'); return;}
  log('Prevodi se '+jobs.length+' izraza s hrvatskog...');
  let done=0, fail=0;
  for(let i=0;i<jobs.length;i++){
    const lang=jobs[i][0], src=jobs[i][1];
    try{const out=await translateOne(src, lang); if(out) config.translations[lang][src]=out; done++;}
    catch(e){fail++;}
    if((i+1)%6===0){saveCfg(config); log('Prevedeno '+(done+fail)+' / '+jobs.length);}
  }
  saveCfg(config); reloadPreview();
  if(activeTab==='languages') render();
  log('Prijevod gotov. Uspjelo '+done+', nije uspjelo '+fail+'.');
}
function mergeTranslations(local, remote){
  if(!remote||!remote.translations) return local;
  local.translations=local.translations||{};
  Object.keys(remote.translations).forEach(lang=>{
    const src=remote.translations[lang]||{};
    const dst=local.translations[lang]=local.translations[lang]||{};
    Object.keys(src).forEach(key=>{if(!dst[key]&&src[key]) dst[key]=src[key];});
  });
  return local;
}

function sitemapLocs(){const domain=String((config.site&&config.site.domain)||'www.hajdihouse.hr').replace(/^https?:\/\//,'').replace(/\/$/,''); const host='https://'+domain; const map={about:'o-nama',amenities:'sadrzaj',pricing:'cjenik',gallery:'galerija',location:'lokacija',contact:'kontakt'}; const ids=(config.customSections||[]).map(s=>s.id); const locs=[host+'/']; (config.sections.order||[]).forEach(sec=>{if(config.sections.visible&&config.sections.visible[sec]===false) return; if(map[sec]) locs.push(host+'/#'+map[sec]); else if(ids.indexOf(sec)>=0) locs.push(host+'/#'+sec);}); return locs;}

function readFileData(file){return new Promise((resolve,reject)=>{const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=()=>reject(r.error||new Error('Čitanje slike nije uspjelo')); r.readAsDataURL(file);});}
function configGitFiles(text){const paths=[gitCfg.pathConfig||'public/js/config.json']; if(String(paths[0]).indexOf('public/js/')===0) paths.push('js/'+paths[0].split('/').pop()); else if(String(paths[0]).indexOf('js/')===0) paths.push('public/'+paths[0]); return paths.map(p=>({path:p,text:text}));}
async function storeUploadedImage(file, folder){
  const dataUrl=await readFileData(file);
  if(!gitCfg.token){
    if(String(dataUrl).length>120000){log(file.name+' je prevelika za ugradnju. Upiši URL slike ili dodaj GitHub token na kartici Git Commit pa je pošalji ponovno.'); return '';}
    log('Mala slika je samo u nacrtu. Za trajnu sliku upiši URL ili dodaj token.');
    return dataUrl;
  }
  const safe=String(file.name||'slika.jpg').replace(/[^a-zA-Z0-9.\-]/g,'_');
  const path='public/images/'+folder+'/'+Date.now()+'-'+safe;
  const url='https://raw.githubusercontent.com/'+gitCfg.owner+'/'+gitCfg.repo+'/'+(gitCfg.branch||'main')+'/'+path;
  return {url:url, file:{path:path, text:String(dataUrl).split(',')[1], alreadyBase64:true}};
}

}

function utf8ToBase64(text){return btoa(unescape(encodeURIComponent(text)));}
async function gh(apiPath, opt){const token=cleanToken(gitCfg.token); if(!token) throw new Error('Nema tokena'); const r=await fetch('https://api.github.com'+apiPath, Object.assign({headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}, opt||{})); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error((j.message||('GitHub '+r.status))+''); return j;}
async function putGitFiles(files, message){const repo='/repos/'+gitCfg.owner+'/'+gitCfg.repo; const branch=gitCfg.branch||'main'; let lastErr; for(let attempt=0; attempt<2; attempt++){const ref=await gh(repo+'/git/ref/heads/'+encodeURIComponent(branch)); const parent=ref.object.sha; const base=await gh(repo+'/git/commits/'+parent); const treeItems=[]; for(const file of files){const blob=await gh(repo+'/git/blobs',{method:'POST',body:JSON.stringify({content:file.alreadyBase64?file.text:utf8ToBase64(file.text),encoding:'base64'})}); treeItems.push({path:file.path,mode:'100644',type:'blob',sha:blob.sha});} const tree=await gh(repo+'/git/trees',{method:'POST',body:JSON.stringify({base_tree:base.tree.sha,tree:treeItems})}); const made=await gh(repo+'/git/commits',{method:'POST',body:JSON.stringify({message:message,tree:tree.sha,parents:[parent]})}); try{await gh(repo+'/git/refs/heads/'+encodeURIComponent(branch),{method:'PATCH',body:JSON.stringify({sha:made.sha})}); return {commit:{sha:made.sha}};}catch(e){lastErr=e; if(String(e.message).toLowerCase().indexOf('fast forward')<0) throw e;}} throw lastErr;}
async function putGitFile(path, text, message, alreadyBase64){return putGitFiles([{path:path,text:text,alreadyBase64:!!alreadyBase64}], message);}
async function commitCfg(){if(!gitCfg.token){log('Postavi token na ovoj kartici. Bez njega commit ne može na GitHub.'); return;} const text=JSON.stringify(config,null,2); if(text.indexOf('data:image')>=0 && text.length>900000){log('Config je prevelik jer sadrži ugrađene slike. Upiši URL ili pošalji sliku uz GitHub token.'); return;} log('Commit start...'); try{ const paths=[gitCfg.pathConfig]; if(gitCfg.pathConfig.indexOf('public/js/')===0) paths.push('js/'+gitCfg.pathConfig.split('/').pop()); else if(gitCfg.pathConfig.indexOf('js/')===0) paths.push('public/'+gitCfg.pathConfig); const files=paths.map(p=>({path:p,text:text})); if(config.seo&&config.seo.sitemapXml) files.push({path:'sitemap.xml',text:config.seo.sitemapXml}); if(config.seo&&config.seo.sitemapHtml) files.push({path:'sitemap.html',text:config.seo.sitemapHtml}); if(config.seo&&config.seo.robotsTxt) files.push({path:'robots.txt',text:config.seo.robotsTxt}); const putJ=await putGitFiles(files, 'Hajdi CMS update '+new Date().toISOString()); log('✅ '+files.map(f=>f.path).join(', ')+' '+(putJ.commit&&putJ.commit.sha?putJ.commit.sha.slice(0,7):'ok'));}catch(e){log('Error '+e.message);}}
async function commitCSV(){if(!gitCfg.token){log('Postavi token na ovoj kartici. Bez njega commit ne može na GitHub.'); return;} let csv='naziv,cijena,jedinica,opis,aktivno\n'; config.pricing.forEach(p=>{csv+=`"${p.naziv}","${p.cijena}","${p.jedinica}","${String(p.opis||'').replace(/"/g,'""')}",${p.aktivno}\n`;}); try{const putJ=await putGitFile(gitCfg.pathCsv, csv, 'Hajdi CMS cjenik '+new Date().toISOString()); log('✅ CSV OK '+(putJ.commit&&putJ.commit.sha?putJ.commit.sha.slice(0,7):'ok'));}catch(e){log('Error '+e.message);}}
function downloadAll(){downloadCfg(); setTimeout(downloadCSV,500);}
function ensure(c){
  c.site=c.site||{name:'Hajdi House',domain:'www.hajdihouse.hr'};
  c.colors=Object.assign({background:'#f2ece0',gold:'#b8952a',dark:'#2c2a24',creamDark:'#e8dfc8'}, c.colors||{});
  c.hero=c.hero||{}; c.about=c.about||{}; c.about.kicker=c.about.kicker||'O kući — 01';
  c.stats=c.stats||[]; c.amenities=c.amenities||[]; c.gallery=c.gallery||[]; c.pricing=c.pricing||[];
  c.features=c.features||[]; c.customSections=c.customSections||[]; c.languages=c.languages||['HR'];
  c.translations=c.translations||{}; c.footer=c.footer||{text:'',links:[]}; c.footer.links=c.footer.links||[];
  c.location=c.location||{}; c.location.title=c.location.title||'Zadnja kuća prije šume.'; c.location.mapCta=c.location.mapCta||'Otvori Maps';
  c.header=c.header||{logoText:'Hajdi House',logoSub:'Žumberak 650m',nav:['O nama','Sadržaj','Cjenik','Galerija','Lokacija','Kontakt'],cta:'Rezerviraj'};
  c.header.nav=c.header.nav||[]; c.header.logoImage=c.header.logoImage||'';
  c.contact=Object.assign({title:'Rezerviraj svoj mir',subtitle:'Javi se direktno — bez posrednika, bez provizije.',email:'',phone:'',airbnb:'',instagram:'#',namePh:'Ime',emailPh:'Email',msgPh:'Poruka',send:'Pošalji upit'}, c.contact||{});
  c.labels=Object.assign({amenitiesTitle:'Što te čeka',pricingTitle:'Cjenik',pricingNote:'Minimalno 2 noći — sve transparentno',galleryTitle:'Galerija'}, c.labels||{});
  c.seo=Object.assign({title:(c.hero&&c.hero.title)||'Hajdi House',description:(c.hero&&c.hero.subtitle)||''}, c.seo||{});
  const builtins=['hero','about','stats','features','amenities','pricing','gallery','location','contact','footer'];
  c.sections=c.sections||{order:builtins.slice(),visible:{}};
  c.sections.order=Array.isArray(c.sections.order)?c.sections.order.slice():builtins.slice();
  c.sections.visible=c.sections.visible||{};
  const ids=(c.customSections||[]).map(s=>s&&s.id).filter(Boolean);
  let order=c.sections.order.filter(name=>builtins.indexOf(name)>=0||ids.indexOf(name)>=0||name==='custom');
  const at=order.indexOf('custom');
  if(at>=0) order.splice(at,1,...ids.filter(id=>order.indexOf(id)<0));
  ids.forEach(id=>{ if(order.indexOf(id)>=0) return; const fi=order.indexOf('footer'); if(fi<0) order.push(id); else order.splice(fi,0,id); });
  builtins.forEach(name=>{ if(order.indexOf(name)<0) order.push(name); if(typeof c.sections.visible[name]==='undefined') c.sections.visible[name]=true; });
  ids.forEach(id=>{ if(typeof c.sections.visible[id]==='undefined') c.sections.visible[id]=true; });
  c.sections.order=order;
  c.seo=c.seo||{};
  return c;
}
async function fetchRemote(){
  const urls=['/public/js/config.json','/js/config.json'];
  for(const u of urls){
    try{
      const r=await fetch(u+'?v='+Date.now(),{cache:'no-store'});
      if(!r.ok) continue;
      const t=await r.text();
      if(t.trim().startsWith('<')) continue;
      return JSON.parse(t);
    }catch(e){}
  }
  return null;
}
async function loadFromServer(){
  const remote=await fetchRemote();
  if(!remote){ log('config.json nije učitan'); return; }
  config=ensure(remote); saveCfg(config); render(); log('Učitano iz config.json');
}
async function boot(){
  let remote=null;
  try{ remote=await fetchRemote(); }catch(e){}
  const localRaw=localStorage.getItem(LS_KEY);
  if(remote) config=remote;
  else if(localRaw){ try{ config=JSON.parse(localRaw); }catch(e){ config=JSON.parse(JSON.stringify(FALLBACK)); } }
  else config=JSON.parse(JSON.stringify(FALLBACK));
  config=ensure(config); saveCfg(config); render();
}
function resetCfg(){if(confirm('Reset na config.json sa stranice?')){localStorage.removeItem(LS_KEY); boot();}}
boot();
</script>
