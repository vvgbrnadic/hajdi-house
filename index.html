<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hajdi House — Kuća na brdu</title>
<meta name="description" content="Drvena kuća za dušu, na rubu šume. Noršić Selo 52B, Žumberak.">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preload" href="/public/js/config.json" as="fetch" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2ece0;--gold:#b8952a;--dark:#2c2a24;--creamDark:#e8dfc8}
body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--dark);-webkit-tap-highlight-color:transparent}
.serif{font-family:'Playfair Display',serif}
.hero-h{height:100svh;height:100dvh;min-height:560px}
.lang-btn.active{background:var(--dark);color:var(--bg)}
</style>
</head>
<body>
<header class="sticky top-0 z-20 backdrop-blur-xl border-b" style="background:color-mix(in srgb, var(--bg) 80%, transparent);border-color:var(--creamDark)">
<div class="max-w-[1240px] mx-auto px-4 md:px-8 h-[56px] md:h-[64px] flex items-center justify-between gap-3">
<div class="flex items-center gap-3 min-w-0"><div id="logoMark" class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-[12px] shrink-0 overflow-hidden" style="background:var(--dark);color:var(--bg)">H</div><div class="min-w-0"><div id="logoText" class="text-[13px] font-semibold leading-none truncate">Hajdi House</div><div id="logoSub" class="text-[10px] opacity-60 leading-none mt-1 truncate">Žumberak 650m</div></div></div>
<nav id="navDesktop" class="hidden lg:flex gap-1"></nav>
<div class="flex items-center gap-2">
<div id="langSwitch" class="hidden sm:flex gap-1"></div>
<a id="headerCta" href="#kontakt" class="text-white rounded-full px-4 h-9 text-[12px] hidden md:flex items-center" style="background:var(--dark)">Rezerviraj</a>
<button id="mBtn" class="lg:hidden w-9 h-9 rounded-full bg-white border flex items-center justify-center" aria-label="Izbornik"><i data-lucide="menu" class="w-4 h-4"></i></button>
</div>
</div>
<div id="mMenu" class="hidden lg:hidden border-t px-4 py-4" style="background:var(--bg);border-color:var(--creamDark)">
<nav id="navMobile"></nav>
<div id="langSwitchMobile" class="flex gap-1 mt-2"></div>
</div>
</header>

<div id="sections">
<section id="hero" data-sec="hero" class="relative hero-h overflow-hidden" style="background:#2c2a24">
<img id="heroImg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-0" style="transition:opacity .45s ease">
<div class="absolute inset-0 bg-gradient-to-b from-black/40 to-black/40"></div>
<div class="relative z-10 max-w-[1240px] mx-auto px-5 md:px-8 h-full flex flex-col justify-center">
<div id="heroBadge" class="bg-white/90 rounded-full px-3 py-1.5 text-[11px] tracking-widest w-fit mb-4">Žumberak 650m</div>
<h1 id="heroTitle" class="serif text-[36px] sm:text-[48px] md:text-[68px] leading-[0.9] text-white max-w-[720px]">Hajdi House — Kuća na brdu</h1>
<p id="heroSub" class="text-white/90 mt-4 max-w-[520px] text-[14px] md:text-[15px] leading-relaxed">Drvena kuća za dušu, na rubu šume. Bez buke, bez žurbe. Samo vatra, knjiga i pogled koji ne staje.</p>
<div class="mt-8 flex flex-col sm:flex-row gap-3">
<a id="heroCta1" href="#kontakt" class="text-white rounded-full px-6 h-12 flex items-center justify-center text-[14px] min-h-[48px]" style="background:var(--gold)">Rezerviraj</a>
<a id="heroCta2" href="#o-nama" class="bg-white rounded-full px-6 h-12 flex items-center justify-center text-[14px] min-h-[48px]" style="color:var(--dark)">Pogledaj kuću</a>
</div>
</div>
</section>

<section id="o-nama" data-sec="about" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12 md:py-24 grid md:grid-cols-2 gap-8">
<div>
<div id="aboutKicker" class="bg-white border rounded-full px-3 py-1 text-[11px] tracking-widest w-fit mb-4">O kući — 01</div>
<h2 id="aboutTitle" class="serif text-[30px] md:text-[44px] leading-[0.95]">Hajdi House nije apartman.</h2>
<p id="aboutP1" class="mt-6 text-[14px] opacity-80 leading-[1.7]"></p>
<p id="aboutP2" class="mt-4 text-[14px] opacity-80 leading-[1.7]"></p>
<div id="aboutQuote" class="mt-6 italic opacity-60 border-l-2 pl-4" style="border-color:var(--gold)"></div>
</div>
<div class="rounded-[24px] overflow-hidden border" style="background:var(--creamDark)"><img id="aboutImg" alt="" class="w-full h-[380px] md:h-[520px] object-cover opacity-0" style="transition:opacity .45s ease" loading="lazy"></div>
</section>

<section id="stats" data-sec="stats" class="max-w-[1240px] mx-auto px-4 md:px-8 pb-8">
<div id="statsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
</section>

<section id="znacajke" data-sec="features" class="max-w-[1240px] mx-auto px-4 md:px-8 py-4">
<div id="featuresGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3"></div>
</section>

<section id="sadrzaj" data-sec="amenities" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12">
<h2 id="amenitiesTitle" class="serif text-[28px] md:text-[44px]">Što te čeka</h2>
<div id="amenitiesGrid" class="mt-8 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3"></div>
</section>

<section id="cjenik" data-sec="pricing" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12">
<h2 id="pricingTitle" class="serif text-[28px] md:text-[44px]">Cjenik</h2>
<p id="pricingNote" class="mt-2 text-[13px] opacity-60"></p>
<div id="pricingGrid" class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4"></div>
<div class="mt-8 overflow-x-auto"><table id="cjenikTable" class="w-full text-left text-[13px] border-collapse"></table></div>
<p id="cjenikFile" class="mt-4 text-[13px]"></p>
</section>

<section id="galerija" data-sec="gallery" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12">
<h2 id="galleryTitle" class="serif text-[24px] md:text-[28px] mb-6">Galerija</h2>
<div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
<div id="lightbox" class="fixed inset-0 z-[80] hidden bg-black/85 p-4 items-center justify-center" role="dialog">
<button type="button" id="lightboxClose" class="absolute top-4 right-4 text-white text-[13px] px-3 h-10 rounded-full border border-white/40">Zatvori</button>
<img id="lightboxImg" alt="" class="max-w-full max-h-[92vh] object-contain">
</div>
</section>

<section id="lokacija" data-sec="location" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12">
<div class="rounded-[24px] md:rounded-[32px] bg-white border p-6 md:p-12 grid md:grid-cols-2 gap-6">
<div>
<h2 id="locTitle" class="serif text-[26px] md:text-[32px]"></h2>
<p id="locDesc" class="mt-4 text-[14px] opacity-70"></p>
<div class="mt-6">
<div id="locAddress" class="font-medium text-[13px]"></div>
<div id="locCoords" class="opacity-60 text-[13px]"></div>
<a id="locMapLink" href="#" target="_blank" rel="noopener" class="inline-flex mt-4 text-white rounded-full px-5 h-11 items-center text-[13px] min-h-[44px]" style="background:var(--dark)">Otvori Maps</a>
</div>
</div>
<iframe id="locMap" title="Lokacija" class="rounded-2xl border w-full h-[240px] md:h-[320px]" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
</section>

<section id="kontakt" data-sec="contact" class="max-w-[1240px] mx-auto px-4 md:px-8 py-12">
<div class="rounded-[24px] md:rounded-[32px] p-6 md:p-12 grid md:grid-cols-2 gap-6" style="background:var(--dark);color:var(--bg)">
<div>
<h2 id="contactTitle" class="serif text-[26px] md:text-[32px]"></h2>
<p id="contactSub" class="mt-3 opacity-70 text-[14px]"></p>
<div id="contactDirect" class="mt-4 text-[13px] opacity-80 grid gap-1"></div>
</div>
<form id="contactForm" class="bg-white rounded-2xl p-5 grid gap-3" style="color:var(--dark)">
<input id="fName" name="ime" class="h-11 rounded-xl border px-4 bg-[#fcfaf5] min-h-[44px]">
<input id="fEmail" name="email" type="email" class="h-11 rounded-xl border px-4 bg-[#fcfaf5] min-h-[44px]">
<textarea id="fMsg" name="poruka" class="min-h-[100px] rounded-xl border p-4 bg-[#fcfaf5]"></textarea>
<button id="fSend" type="submit" class="text-white rounded-full h-12 min-h-[48px]" style="background:var(--dark)">Pošalji upit</button>
<p id="formNote" class="text-[12px] opacity-60"></p>
</form>
</div>
</section>

<footer data-sec="footer" class="max-w-[1240px] mx-auto px-4 md:px-8 py-8 border-t mt-6 flex flex-col md:flex-row justify-between gap-4 text-[12px] opacity-60" style="border-color:var(--creamDark)">
<div id="footerText"></div>
<div id="footerLinks" class="flex flex-wrap gap-4"></div>
</footer>
</div>

<script>
const ICON_ALIAS = {fire:'flame',sauna:'bath',terasa:'fence',window:'app-window',bazen:'waves',kitchen:'cooking-pot',grill:'beef',utensils:'utensils',bed:'bed-double',books:'book-open',parking:'car',hike:'footprints'};
const FALLBACK_IMG = 'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><rect width="100%" height="100%" fill="#e8dfc8"/><text x="50%" y="50%" fill="#2c2a24" font-family="Georgia,serif" font-size="48" text-anchor="middle" dominant-baseline="middle">Hajdi House</text></svg>');
let SITE = null;
let currentLang = 'HR';
try { currentLang = localStorage.getItem('hajdi_lang') || 'HR'; } catch(e) {}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function iconName(name){
  const raw = String(name||'circle');
  const key = raw.includes(':') ? raw.split(':').pop() : raw;
  return ICON_ALIAS[key] || key;
}
function iconHtml(name){
  const raw = String(name||'circle');
  if(raw.includes(':')){
    const parts = raw.split(':');
    return `<img alt="" src="https://api.iconify.design/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1]||'circle')}.svg" width="20" height="20">`;
  }
  return `<i data-lucide="${esc(iconName(raw))}" class="w-5 h-5"></i>`;
}
function navLabel(item){
  return typeof item==='string' ? item : (item && item.label) || '';
}
function navHref(item){
  if(item && typeof item==='object' && item.href) return item.href;
  const label = navLabel(item);
  const customs = (SITE && SITE.customSections) || [];
  const hit = customs.filter(s => s && (s.title===label || s.id===label));
  if(hit.length===1 && hit[0].id) return '#'+hit[0].id;
  const k = String(label||'').toLowerCase().trim();
  const map = {
    'o nama':'#o-nama','o kući':'#o-nama','o kuci':'#o-nama','about':'#o-nama',
    'sadržaj':'#sadrzaj','sadrzaj':'#sadrzaj','amenities':'#sadrzaj',
    'cjenik':'#cjenik','pricing':'#cjenik',
    'galerija':'#galerija','gallery':'#galerija',
    'lokacija':'#lokacija','location':'#lokacija',
    'kontakt':'#kontakt','contact':'#kontakt'
  };
  if(map[k]) return map[k];
  const slug = k.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return '#'+(slug||'hero');
}
function setImg(img, url){
  if(!img) return;
  const src = url || '';
  img.onload = function(){ img.style.opacity = '1'; };
  img.onerror = function(){
    if(img.dataset.fallback === 'done') return;
    img.dataset.fallback = 'done';
    img.src = FALLBACK_IMG;
  };
  if(!src){
    img.style.opacity = '0';
    img.removeAttribute('src');
    return;
  }
  if(img.getAttribute('src') === src && img.complete && img.naturalWidth){
    img.style.opacity = '1';
    return;
  }
  img.style.opacity = '0';
  delete img.dataset.fallback;
  img.src = src;
}
function t(text){
  if(text==null) return '';
  const lang = String(currentLang||'HR').toUpperCase();
  if(lang==='HR' || !SITE || !SITE.translations) return text;
  const dict = SITE.translations[lang] || SITE.translations[currentLang] || {};
  if(dict[text]) return dict[text];
  const trimmed = String(text).trim();
  if(trimmed!==text && dict[trimmed]) return dict[trimmed];
  return text;
}
function trNode(el, text){
  if(!el) return;
  el.textContent = t(text||'');
  el.dataset.src = text||'';
}

async function loadConfig(){
  const preview = new URLSearchParams(location.search).has('cmspreview');
  if(preview){
    try{
      const raw = localStorage.getItem('hajdi_full_config_v3');
      if(raw) return JSON.parse(raw);
    }catch(e){}
  }
  const urls = ['/public/js/config.json','/js/config.json'];
  for(const u of urls){
    try{
      const r = await fetch(u+'?v='+Date.now(),{cache:'no-store'});
      if(!r.ok) continue;
      const text = await r.text();
      if(text.trim().startsWith('<')) continue;
      return JSON.parse(text);
    }catch(e){}
  }
  return null;
}

function expandOrder(c){
  const order = (c.sections && Array.isArray(c.sections.order)) ? c.sections.order.slice() : [];
  const ids = (c.customSections||[]).map(s=>s && s.id).filter(Boolean);
  const at = order.indexOf('custom');
  if(at>=0) order.splice(at, 1, ...ids.filter(id=>order.indexOf(id)<0));
  ids.forEach(id=>{
    if(order.indexOf(id)>=0) return;
    const footerAt = order.indexOf('footer');
    if(footerAt<0) order.push(id);
    else order.splice(footerAt, 0, id);
  });
  return order;
}
function applyOrder(c){
  const root = document.getElementById('sections');
  const known = [...root.querySelectorAll(':scope > [data-sec]')];
  const order = expandOrder(c);
  known.forEach(el=>{ if(order.indexOf(el.dataset.sec)<0) order.push(el.dataset.sec); });
  order.forEach(name=>{
    const el = root.querySelector(':scope > [data-sec="'+name+'"]');
    if(el) root.appendChild(el);
  });
  const vis = (c.sections && c.sections.visible) || {};
  known.forEach(el=>{
    let show = vis[el.dataset.sec];
    if(show===undefined && el.dataset.custom && vis.custom===false) show=false;
    el.style.display = show===false ? 'none' : '';
  });
}

function renderLangs(codes){
  const draw = (el, mobile)=>{
    el.innerHTML = codes.map(code=>`<button type="button" data-lang="${esc(code)}" class="lang-btn px-2 h-7 rounded-full border text-[10px] font-semibold ${code===currentLang?'active':''}">${esc(code)}</button>`).join('');
    el.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
      currentLang = String(btn.dataset.lang||'HR').toUpperCase();
      document.documentElement.lang = currentLang.toLowerCase();
      try{ localStorage.setItem('hajdi_lang', currentLang); }catch(e){}
      if(mobile) document.getElementById('mMenu').classList.add('hidden');
      apply(SITE);
    }));
  };
  draw(document.getElementById('langSwitch'), false);
  draw(document.getElementById('langSwitchMobile'), true);
}

function renderNav(items){
  const desk = document.getElementById('navDesktop');
  const mob = document.getElementById('navMobile');
  const list = items||[];
  desk.innerHTML = list.map(item=>`<a href="${esc(navHref(item))}" class="px-3 h-8 rounded-full bg-white border text-[12px] flex items-center">${esc(t(navLabel(item)))}</a>`).join('');
  mob.innerHTML = list.map(item=>`<a href="${esc(navHref(item))}" class="py-3 px-4 rounded-xl bg-white border block mb-2">${esc(t(navLabel(item)))}</a>`).join('');
  mob.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>document.getElementById('mMenu').classList.add('hidden')));
}

function apply(c){
  if(!c) return;
  SITE = c;
  document.documentElement.lang = String(currentLang||'HR').toLowerCase();
  const colors = c.colors||{};
  if(colors.background) document.documentElement.style.setProperty('--bg', colors.background);
  if(colors.gold) document.documentElement.style.setProperty('--gold', colors.gold);
  if(colors.dark) document.documentElement.style.setProperty('--dark', colors.dark);
  if(colors.creamDark) document.documentElement.style.setProperty('--creamDark', colors.creamDark);
  document.body.style.background = colors.background || '';
  document.body.style.color = colors.dark || '';

  const seo = c.seo||{};
  const pageTitle = seo.title || (c.hero&&c.hero.title) || '';
  if(pageTitle) document.title = t(pageTitle);
  const md = document.querySelector('meta[name="description"]');
  if(md && seo.description) md.setAttribute('content', t(seo.description));
  if(new URLSearchParams(location.search).has('cmspreview')){
    let robots = document.querySelector('meta[name="robots"]');
    if(!robots){ robots=document.createElement('meta'); robots.name='robots'; document.head.appendChild(robots); }
    robots.content='noindex';
  }

  const header = c.header||{};
  trNode(document.getElementById('logoText'), header.logoText||'Hajdi House');
  trNode(document.getElementById('logoSub'), header.logoSub||'');
  const mark = document.getElementById('logoMark');
  if(header.logoImage){
    mark.innerHTML = `<img alt="" src="${esc(header.logoImage)}" class="w-full h-full object-cover">`;
    mark.style.background = 'transparent';
  } else {
    mark.style.background = '';
    mark.textContent = (header.logoText||'H').trim().charAt(0).toUpperCase() || 'H';
  }
  const cta = document.getElementById('headerCta');
  trNode(cta, header.cta||'Rezerviraj');
  cta.href = header.ctaHref || '#kontakt';
  renderNav(header.nav||[]);
  renderLangs(c.languages&&c.languages.length?c.languages:['HR']);

  const hero = c.hero||{};
  const heroImg = document.getElementById('heroImg');
  setImg(heroImg, hero.image);
  heroImg.style.filter = 'blur('+(hero.blur==null?0:hero.blur)+'px)';
  trNode(document.getElementById('heroBadge'), hero.badge||'');
  trNode(document.getElementById('heroTitle'), hero.title||'');
  trNode(document.getElementById('heroSub'), hero.subtitle||'');
  const heroCta1 = document.getElementById('heroCta1');
  const heroCta2 = document.getElementById('heroCta2');
  trNode(heroCta1, hero.cta1||'');
  trNode(heroCta2, hero.cta2||'');
  heroCta1.href = hero.cta1Href || '#kontakt';
  heroCta2.href = hero.cta2Href || '#o-nama';

  const about = c.about||{};
  trNode(document.getElementById('aboutKicker'), about.kicker||'');
  trNode(document.getElementById('aboutTitle'), about.title||'');
  trNode(document.getElementById('aboutP1'), about.p1||'');
  trNode(document.getElementById('aboutP2'), about.p2||'');
  trNode(document.getElementById('aboutQuote'), about.quote||'');
  setImg(document.getElementById('aboutImg'), about.image);

  document.getElementById('statsGrid').innerHTML = (c.stats||[]).map(s=>`<div class="bg-white rounded-2xl border p-4 text-center min-h-[80px] flex flex-col justify-center"><div class="serif text-[18px] font-bold">${esc(s.value)}</div><div class="text-[10px] uppercase opacity-60 mt-1">${esc(t(s.label||''))}</div></div>`).join('');

  const features = c.features||[];
  document.getElementById('featuresGrid').innerHTML = features.map(f=>`<div class="rounded-2xl bg-white border p-5"><div class="w-10 h-10 rounded-full border flex items-center justify-center mb-3" style="background:var(--bg)">${iconHtml(f.icon)}</div><div class="font-medium text-[14px]">${esc(t(f.title||''))}</div><p class="text-[12px] opacity-70 mt-2 leading-relaxed">${esc(t(f.desc||''))}</p></div>`).join('');

  const labels = c.labels||{};
  trNode(document.getElementById('amenitiesTitle'), labels.amenitiesTitle||'Što te čeka');
  document.getElementById('amenitiesGrid').innerHTML = (c.amenities||[]).map(a=>`<div class="rounded-2xl bg-white/70 border p-5 flex items-center gap-4 min-h-[72px]"><div class="w-11 h-11 rounded-full border flex items-center justify-center shrink-0" style="background:var(--bg)">${iconHtml(a.icon)}</div><div><div class="text-[14px] font-medium">${esc(t(a.label||''))}</div><div class="text-[11px] opacity-50">${esc(t(a.category||''))}</div></div></div>`).join('');

  trNode(document.getElementById('pricingTitle'), labels.pricingTitle||'Cjenik');
  trNode(document.getElementById('pricingNote'), labels.pricingNote||'');
  const anchorDate = (c.cjenik&&c.cjenik.datumSidrene)||'10.09.2026';
  const euroLabel = (v)=>{ const n=parseFloat(String(v||'').replace('€','').replace(/\s/g,'').replace(',','.')); return isFinite(n)?n.toFixed(2).replace('.',',')+' €':(v||''); };
  document.getElementById('pricingGrid').innerHTML = (c.pricing||[]).filter(p=>p.aktivno!==false).map(p=>`<div class="rounded-[24px] bg-white border p-6"><div class="text-[11px] opacity-50">${esc(t(p.naziv||''))}</div><div class="serif text-[32px] mt-2" style="color:var(--gold)">${esc(p.cijena||'')} <span class="text-[13px] opacity-60">${esc(t(p.jedinica||''))}</span></div><div class="text-[13px] mt-3">${esc(t('Sidrena cijena'))} ${esc(anchorDate)}: <b>${esc(euroLabel(p.sidrena||p.cijena))}</b></div>${p.posebniOblik==='DA'?`<div class="text-[12px] mt-1">${esc(t('Posebni oblik prodaje'))}: ${esc(p.nazivPosebnog||'')}</div>`:''}<div class="text-[13px] opacity-70 mt-2">${esc(t(p.opis||''))}</div></div>`).join('');
  const rows=(c.pricing||[]).filter(p=>p.aktivno!==false);
  document.getElementById('cjenikTable').innerHTML = `<thead><tr><th class="py-2 pr-3 border-b">${esc(t('Usluga'))}</th><th class="py-2 pr-3 border-b">${esc(t('Cijena'))}</th><th class="py-2 pr-3 border-b">${esc(t('Posebni oblik'))}</th><th class="py-2 border-b">${esc(t('Sidrena cijena'))} ${esc(anchorDate)}</th></tr></thead><tbody>${rows.map(p=>`<tr><td class="py-2 pr-3 border-b">${esc(p.naziv||'')}</td><td class="py-2 pr-3 border-b">${esc(euroLabel(p.cijena))}</td><td class="py-2 pr-3 border-b">${esc(p.posebniOblik==='DA'?(p.nazivPosebnog||'DA'):'NE')}</td><td class="py-2 border-b">${esc(euroLabel(p.sidrena||p.cijena))}</td></tr>`).join('')}</tbody>`;
  const file=(c.cjenik&&c.cjenik.datoteka)||'/public/js/cjenik.csv';
  document.getElementById('cjenikFile').innerHTML = `<a class="underline" href="${esc(file)}">${esc(t(labels.pricingCsv||'Preuzmi cjenik (CSV)'))}</a><span class="opacity-70"> · ${esc(t(labels.pricingLaw||''))}</span>`;

  trNode(document.getElementById('galleryTitle'), labels.galleryTitle||'Galerija');
  document.getElementById('galleryGrid').innerHTML = (c.gallery||[]).map(g=>{
    const src = typeof g==='string'?g:(g.image||'');
    if(!src) return '';
    return `<div class="rounded-[24px] overflow-hidden border"><img alt="" src="${esc(src)}" data-fallback="1" class="w-full h-[220px] md:h-[240px] object-cover cursor-zoom-in" loading="lazy"></div>`;
  }).join('');
  document.querySelectorAll('#galleryGrid img').forEach(img=>{
    setImg(img, img.getAttribute('src'));
    img.addEventListener('click', ()=>openLightbox(img.currentSrc||img.src));
  });

  const loc = c.location||{};
  trNode(document.getElementById('locTitle'), loc.title||'');
  trNode(document.getElementById('locDesc'), loc.desc||'');
  trNode(document.getElementById('locAddress'), loc.address||'');
  document.getElementById('locCoords').textContent = [loc.lat, loc.lng].filter(Boolean).join(', ');
  const mapLink = document.getElementById('locMapLink');
  mapLink.href = loc.googleMapsLink || ('https://maps.google.com/?q='+encodeURIComponent((loc.lat||'')+','+(loc.lng||'')));
  trNode(mapLink, loc.mapCta||'Otvori Maps');
  if(loc.lat && loc.lng){
    document.getElementById('locMap').src = 'https://maps.google.com/maps?q='+encodeURIComponent(loc.lat+','+loc.lng)+'&z=13&output=embed';
  }

  const contact = c.contact||{};
  trNode(document.getElementById('contactTitle'), contact.title||'');
  trNode(document.getElementById('contactSub'), contact.subtitle||'');
  const direct = [];
  if(contact.email) direct.push(`<a href="mailto:${esc(contact.email)}">${esc(contact.email)}</a>`);
  if(contact.phone) direct.push(`<a href="tel:${esc(String(contact.phone).replace(/\s/g,''))}">${esc(contact.phone)}</a>`);
  if(contact.airbnb) direct.push(`<a href="${esc(contact.airbnb)}" target="_blank" rel="noopener">Airbnb</a>`);
  if(contact.instagram && contact.instagram!=='#') direct.push(`<a href="${esc(contact.instagram)}" target="_blank" rel="noopener">Instagram</a>`);
  document.getElementById('contactDirect').innerHTML = direct.join('');
  document.getElementById('fName').placeholder = t(contact.namePh||'Ime');
  document.getElementById('fEmail').placeholder = t(contact.emailPh||'Email');
  document.getElementById('fMsg').placeholder = t(contact.msgPh||'Poruka');
  trNode(document.getElementById('fSend'), contact.send||'Pošalji upit');
  document.getElementById('formNote').textContent = '';

  document.querySelectorAll('#sections > [data-custom="1"]').forEach(el=>el.remove());
  const sectionsRoot = document.getElementById('sections');
  (c.customSections||[]).forEach(s=>{
    const el = document.createElement('section');
    const id = s.id || 'custom';
    el.id = id;
    el.dataset.sec = id;
    el.dataset.custom = '1';
    el.className = 'max-w-[1240px] mx-auto px-4 md:px-8 py-12';
    el.innerHTML = `<div class="grid md:grid-cols-2 gap-8 items-center"><div><h2 class="serif text-[28px] md:text-[40px]">${esc(t(s.title||''))}</h2><p class="mt-4 text-[14px] opacity-80 leading-[1.7] whitespace-pre-wrap">${esc(t(s.body||''))}</p></div>${s.image?`<div class="rounded-[24px] overflow-hidden border"><img alt="" data-fallback="1" src="${esc(s.image)}" class="w-full h-[320px] object-cover"></div>`:''}</div>`;
    sectionsRoot.appendChild(el);
  });
  document.querySelectorAll('#sections > [data-custom="1"] img').forEach(img=>setImg(img, img.getAttribute('src')));

  const footer = c.footer||{};
  trNode(document.getElementById('footerText'), footer.text||'');
  document.getElementById('footerLinks').innerHTML = (footer.links||[]).filter(l=>l&&l.url&&l.url!=='#').map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(t(l.label||''))}</a>`).join('');

  applyOrder(c);
  try{ lucide.createIcons(); }catch(e){}
}

document.getElementById('mBtn').addEventListener('click',()=>document.getElementById('mMenu').classList.toggle('hidden'));
document.getElementById('contactForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  const email = (SITE && SITE.contact && SITE.contact.email) || '';
  const note = document.getElementById('formNote');
  if(!email){
    note.textContent = t('Upiši email u adminu (Kontakt), pa će se upit otvoriti u mailu.');
    return;
  }
  const name = document.getElementById('fName').value.trim();
  const from = document.getElementById('fEmail').value.trim();
  const msg = document.getElementById('fMsg').value.trim();
  const subject = encodeURIComponent('Upit — '+(SITE.site&&SITE.site.name||'Hajdi House'));
  const body = encodeURIComponent('Ime: '+name+'\nEmail: '+from+'\n\n'+msg);
  location.href = 'mailto:'+email+'?subject='+subject+'&body='+body;
});

function openLightbox(src){const box=document.getElementById('lightbox'); const img=document.getElementById('lightboxImg'); if(!box||!img||!src) return; img.src=src; box.classList.remove('hidden'); box.classList.add('flex');}
function closeLightbox(){const box=document.getElementById('lightbox'); if(!box) return; box.classList.add('hidden'); box.classList.remove('flex'); const img=document.getElementById('lightboxImg'); if(img) img.removeAttribute('src');}
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox'||e.target.id==='lightboxClose') closeLightbox(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLightbox(); });
loadConfig().then(cfg=>{ if(cfg) apply(cfg); else try{ lucide.createIcons(); }catch(e){} });
</script>
</body>
</html>
