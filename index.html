.",Rezerviraj:"Book now","Pogledaj kuću":"View the house","Tipka: svježi zrak uključen u cijenu":"Tip: fresh air included","Hajdi House nije apartman.":"Hajdi House is not an apartment.","To je drvena kuća koja diše. Miris borovine, škripanje poda, kamin koji pucketa cijelu noć. Nema televizora. Nema susjeda. Samo šuma ispod, nebo iznad i ti između.":"It's a wooden house that breathes. Scent of pine, creaking floors, fireplace crackling all night. No TV. No neighbors. Just forest below, sky above, and you in between.","Gradili smo je polako, rukama, bez žurbe. Svaka daska ima priču, svaki prozor gleda na Žumberak. Ovdje vrijeme ne prolazi brže — konačno prolazi kako treba. Sporo.":"We built it slowly, by hand, without rush. Every plank has a story, every window looks at Žumberak. Time doesn't pass faster here — finally it passes as it should. Slowly.","Dođi s knjigom. Otići ćeš s pričom.":"Come with a book. You'll leave with a story.","Sve za sporiji dan.":"Everything for a slower day.","O kući":"About","Sadržaj":"Amenities",Cjenik:"Pricing",Galerija:"Gallery",Lokacija:"Location","Što te čeka":"What awaits","Galerija — šuma, svjetlo, drvo.":"Gallery — forest, light, wood.","Na rubu Parka prirode Žumberak, 40 min od Zagreba. Zadnja kuća prije šume. Makadam 800m od asfalta — treba vam malo volje, vratit će vam se tišinom.":"At the edge of Žumberak Nature Park, 40 min from Zagreb. The last house before the forest. 800m gravel from asphalt — it takes a little will, it returns in silence.","40 min od Zagreba":"40 min from Zagreb","Makadam 800m":"Gravel 800m",gosta:"guests","spavaća soba":"bedroom","kuće":"of house","godišnja doba":"seasons","drva i kamena":"wood & stone",nadmorske:"altitude",buke:"noise","Kamin na drva":"Wood fireplace","Sauna uz šumu":"Forest sauna","Terasa 40m² s pogledom":"Terrace 40m² with view","Panoramski prozor":"Panoramic window","Vanjski bazen":"Outdoor pool","Potpuno opremljena kuhinja":"Fully equipped kitchen","Roštilj na drva":"Wood grill","D
